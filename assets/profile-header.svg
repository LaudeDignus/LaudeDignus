<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Mouhamed Wade — LaudeDignus</title>
  <desc id="desc">Full-Stack Engineer, AI Systems Builder and Product Builder based in Dakar, Senegal.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="58%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="17" fill="none" stroke="#30363d"/>

  <circle cx="1040" cy="46" r="86" fill="#6366f1" opacity="0.05"/>
  <circle cx="1110" cy="236" r="120" fill="#06b6d4" opacity="0.04"/>

  <g transform="translate(74 64)">
    <rect x="0" y="0" width="68" height="68" rx="18" fill="#161b22" stroke="#30363d"/>
    <path d="M18 46V22h7l9 14 9-14h7v24h-7V33l-9 13-9-13v13z" fill="url(#accent)"/>
  </g>

  <text x="172" y="95" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" letter-spacing="2">LAUDEDIGNUS // DAKAR, SENEGAL</text>

  <text x="172" y="143" fill="#f0f6fc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700" letter-spacing="0.5">Mouhamed Wade</text>

  <text x="172" y="181" fill="#c9d1d9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">
    Full-Stack Engineer  ·  AI Systems Builder  ·  Product Builder
  </text>

  <rect x="172" y="207" width="515" height="3" rx="2" fill="url(#accent)" filter="url(#glow)"/>

  <text x="172" y="239" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
    BUILD → LEARN → SHIP → ITERATE
  </text>

  <g transform="translate(945 108)" opacity="0.9">
    <circle cx="0" cy="0" r="5" fill="#8b5cf6"/>
    <circle cx="62" cy="-24" r="5" fill="#6366f1"/>
    <circle cx="116" cy="18" r="5" fill="#06b6d4"/>
    <circle cx="42" cy="61" r="5" fill="#8b5cf6"/>
    <circle cx="122" cy="82" r="5" fill="#6366f1"/>
    <path d="M4 -2 L58 -22 M66 -21 L112 15 M113 22 L47 58 M47 63 L117 80 M3 4 L39 57" stroke="url(#accent)" stroke-width="2" opacity="0.65"/>
  </g>
</svg>